<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoodWeAI — Painel Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:#E3000F;--dark:#1a1a1a;--dark2:#252525;--dark3:#2f2f2f;--white:#fff;--muted:#888;--border:#3a3a3a}
body{font-family:'Barlow',sans-serif;background:var(--dark);color:var(--white);min-height:100vh}
#login{position:fixed;inset:0;background:var(--dark);display:flex;align-items:center;justify-content:center;z-index:100}
.lbox{width:360px;background:var(--dark2);border:1px solid var(--dark3);border-top:3px solid var(--red);padding:2.5rem 2rem}
.brand{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;letter-spacing:2px}
.brand span{color:var(--red)}
.lsub{font-size:11px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-top:2px;margin-bottom:1.8rem}
.lbox label{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;margin-top:1rem}
.lbox input{width:100%;background:var(--dark3);border:1px solid #444;color:var(--white);padding:10px 14px;font-family:'Barlow',sans-serif;font-size:15px;outline:none;transition:border-color .2s}
.lbox input:focus{border-color:var(--red)}
.lbtn{width:100%;margin-top:1.6rem;padding:12px;background:var(--red);color:var(--white);border:none;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer}
.lerr{margin-top:.8rem;font-size:13px;color:var(--red);text-align:center;min-height:18px}
#app{display:none}
header{background:var(--dark2);border-bottom:1px solid var(--border);padding:0 2rem;height:58px;display:flex;align-items:center;justify-content:space-between}
.hl{display:flex;align-items:center;gap:12px}
.mark{width:34px;height:34px;background:var(--red);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px}
.ht{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600;letter-spacing:1px}
.ht span{color:var(--red)}
.hs{font-size:11px;color:var(--muted);letter-spacing:1px}
.hbtn{background:none;border:1px solid #444;color:var(--muted);padding:5px 12px;font-size:12px;cursor:pointer;font-family:'Barlow',sans-serif;transition:all .2s}
.hbtn:hover{border-color:var(--red);color:var(--red)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 2rem;background:var(--dark2)}
.tab{padding:14px 20px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.tab.active{color:var(--white);border-bottom-color:var(--red)}
.tab:hover{color:var(--white)}
.panel{display:none;padding:2rem}
.panel.active{display:block}
.sec-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:600;letter-spacing:1px;margin-bottom:1.2rem}
.card{background:var(--dark2);border:1px solid var(--border);padding:1.5rem;margin-bottom:1rem}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 12px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--dark3);color:#ddd}
tr:hover td{background:var(--dark3)}
.badge{display:inline-block;padding:2px 8px;font-size:11px;letter-spacing:1px;text-transform:uppercase}
.badge.admin{background:#2a1a3a;color:#b088f0;border:1px solid #6030a0}
.badge.sindico{background:#1a2a3a;color:#60a0e0;border:1px solid #2060a0}
.badge.morador{background:#1a3a2a;color:#60c080;border:1px solid #207040}
.badge.ativo{background:#1a3a1a;color:#60c060;border:1px solid #207020}
.badge.inativo{background:#3a1a1a;color:#c06060;border:1px solid #a02020}
.abtn{background:none;border:1px solid #444;color:var(--muted);padding:4px 10px;font-size:11px;cursor:pointer;font-family:'Barlow',sans-serif;transition:all .2s}
.abtn:hover{border-color:var(--red);color:var(--red)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.form-row.full{grid-template-columns:1fr}
.field label{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--dark3);border:1px solid #444;color:var(--white);padding:8px 12px;font-family:'Barlow',sans-serif;font-size:14px;outline:none;transition:border-color .2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--red)}
.field select option{background:var(--dark3)}
.field textarea{resize:vertical;min-height:120px;line-height:1.5}
.sbtn{padding:8px 20px;background:var(--red);color:var(--white);border:none;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:background .2s}
.sbtn:hover{background:#ff1a26}
.msg-ok{color:#60c060;font-size:13px;margin-top:.5rem}
.msg-err{color:var(--red);font-size:13px;margin-top:.5rem}
.prompt-box{background:var(--dark3);border:1px solid var(--border);padding:1rem;font-size:13px;line-height:1.6;color:#ddd;white-space:pre-wrap;margin-bottom:1rem}
.vers{font-size:11px;color:var(--muted);margin-bottom:.5rem}
</style>
</head>
<body>
<div id="login">
  <div class="lbox">
    <div class="brand">GOODWE<span>AI</span></div>
    <div class="lsub">Painel Administrativo</div>
    <label>Usuário</label><input id="u" type="text" placeholder="admin">
    <label>Senha</label><input id="p" type="password" placeholder="••••••••">
    <button class="lbtn" onclick="login()">Entrar</button>
    <div class="lerr" id="er"></div>
  </div>
</div>

<div id="app">
  <header>
    <div class="hl">
      <div class="mark">K</div>
      <div><div class="ht">GOODWE<span>AI</span></div><div class="hs">Painel Administrativo</div></div>
    </div>
    <a href="/chat.html" class="hbtn" style="text-decoration:none">Abrir Chat</a>
    <button class="hbtn" onclick="logout()">Sair</button>
  </header>
  <div class="tabs">
    <div class="tab active" onclick="showTab('usuarios',this)">Usuários</div>
    <div class="tab" onclick="showTab('prompts',this)">System Prompts</div>
    <div class="tab" onclick="showTab('historico',this)">Histórico</div>
  </div>

  <!-- USUÁRIOS -->
  <div class="panel active" id="tab-usuarios">
    <div class="sec-title">Usuários do sistema</div>
    <div class="card">
      <div style="font-size:13px;color:var(--muted);margin-bottom:1rem">Adicionar novo usuário</div>
      <div class="form-row">
        <div class="field"><label>Username</label><input id="nu" type="text" placeholder="joao.silva"></div>
        <div class="field"><label>Nome completo</label><input id="nn" type="text" placeholder="João Silva"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Senha</label><input id="np" type="password" placeholder="••••••••"></div>
        <div class="field"><label>Perfil</label>
          <select id="nperf">
            <option value="morador">Morador</option>
            <option value="sindico">Síndico</option>
            <option value="admin">Admin</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="field"><label>Email (opcional)</label><input id="ne" type="text" placeholder="joao@email.com"></div>
      </div>
      <button class="sbtn" onclick="criarUsuario()">Criar Usuário</button>
      <div id="umsg"></div>
    </div>
    <table id="tabela-users"><thead><tr><th>Usuário</th><th>Nome</th><th>Perfil</th><th>Status</th><th>Criado em</th><th>Ação</th></tr></thead><tbody id="tbody-users"><tr><td colspan="6" style="color:var(--muted);text-align:center;padding:2rem">Carregando...</td></tr></tbody></table>
  </div>

  <!-- PROMPTS -->
  <div class="panel" id="tab-prompts">
    <div class="sec-title">System Prompts</div>
    <div id="prompts-lista">Carregando...</div>
  </div>

  <!-- HISTÓRICO -->
  <div class="panel" id="tab-historico">
    <div class="sec-title">Histórico de conversas</div>
    <table><thead><tr><th>Usuário</th><th>Pergunta</th><th>Resposta</th><th>Data</th></tr></thead><tbody id="tbody-hist"><tr><td colspan="4" style="color:var(--muted);text-align:center;padding:2rem">Carregando...</td></tr></tbody></table>
  </div>
</div>

<script>
const API='http://localhost:8000';
let token=null;

document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter')login()});

async function login(){
  const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;
  const er=document.getElementById('er');
  if(!u||!p){er.textContent='Preencha usuário e senha.';return}
  try{
    const r=await fetch(`${API}/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    if(!r.ok){er.textContent='Acesso negado.';return}
    const d=await r.json();
    if(d.perfil!=='admin'){er.textContent='Somente administradores.';return}
    token=d.access_token;
    sessionStorage.setItem('token',d.access_token);
    sessionStorage.setItem('perfil',d.perfil);
    sessionStorage.setItem('nome',d.nome);
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';
    carregarUsuarios();
  }catch{er.textContent='Erro de conexão.'}
}

function logout(){sessionStorage.removeItem('token');sessionStorage.removeItem('perfil');sessionStorage.removeItem('nome');token=null;document.getElementById('login').style.display='flex';document.getElementById('app').style.display='none';document.getElementById('p').value=''}

function showTab(id,el){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  el.classList.add('active');
  if(id==='usuarios')carregarUsuarios();
  if(id==='prompts')carregarPrompts();
  if(id==='historico')carregarHistorico();
}

function hdr(){return{Authorization:`Bearer ${token}`,'Content-Type':'application/json'}}

async function carregarUsuarios(){
  const r=await fetch(`${API}/admin/usuarios`,{headers:hdr()});
  const users=await r.json();
  const tbody=document.getElementById('tbody-users');
  tbody.innerHTML=users.map(u=>`
    <tr>
      <td><code style="font-size:12px;color:#ccc">${u.username}</code></td>
      <td>${u.nome}</td>
      <td><span class="badge ${u.perfil}">${u.perfil}</span></td>
      <td><span class="badge ${u.ativo?'ativo':'inativo'}">${u.ativo?'Ativo':'Inativo'}</span></td>
      <td style="color:var(--muted)">${new Date(u.criado_em).toLocaleDateString('pt-BR')}</td>
      <td><button class="abtn" onclick="toggleUser('${u.id}',${!u.ativo})">${u.ativo?'Desativar':'Ativar'}</button></td>
    </tr>`).join('');
}

async function toggleUser(id,ativo){
  await fetch(`${API}/admin/usuarios/${id}/ativo?ativo=${ativo}`,{method:'PATCH',headers:hdr()});
  carregarUsuarios();
}

async function criarUsuario(){
  const dados={username:document.getElementById('nu').value.trim(),password:document.getElementById('np').value,nome:document.getElementById('nn').value.trim(),email:document.getElementById('ne').value.trim()||null,perfil_nome:document.getElementById('nperf').value};
  const msg=document.getElementById('umsg');
  try{
    const r=await fetch(`${API}/admin/usuarios`,{method:'POST',headers:hdr(),body:JSON.stringify(dados)});
    if(r.ok){msg.innerHTML='<div class="msg-ok">Usuário criado com sucesso!</div>';carregarUsuarios()}
    else{const e=await r.json();msg.innerHTML=`<div class="msg-err">${e.detail||'Erro ao criar usuário.'}</div>`}
  }catch{msg.innerHTML='<div class="msg-err">Erro de conexão.</div>'}
}

async function carregarPrompts(){
  const r=await fetch(`${API}/admin/prompts`,{headers:hdr()});
  const prompts=await r.json();
  const lista=document.getElementById('prompts-lista');
  lista.innerHTML=prompts.map(p=>`
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:.8rem">
        <span class="badge ${p.perfil}">${p.perfil}</span>
        <span class="vers">Versão ${p.versao} · ${new Date(p.criado_em).toLocaleDateString('pt-BR')}</span>
      </div>
      <div class="prompt-box">${p.conteudo}</div>
      <div class="field"><label>Novo conteúdo para ${p.perfil}</label><textarea id="pt-${p.perfil}">${p.conteudo}</textarea></div>
      <button class="sbtn" onclick="salvarPrompt('${p.perfil}')">Salvar nova versão</button>
      <div id="pmsg-${p.perfil}"></div>
    </div>`).join('');
}

async function salvarPrompt(perfil){
  const conteudo=document.getElementById('pt-'+perfil).value.trim();
  const msg=document.getElementById('pmsg-'+perfil);
  if(!conteudo){msg.innerHTML='<div class="msg-err">Conteúdo não pode ser vazio.</div>';return}
  const r=await fetch(`${API}/admin/prompts/${perfil}`,{method:'PUT',headers:hdr(),body:JSON.stringify({conteudo})});
  if(r.ok){msg.innerHTML='<div class="msg-ok">Prompt atualizado com sucesso!</div>';setTimeout(()=>carregarPrompts(),1000)}
  else msg.innerHTML='<div class="msg-err">Erro ao salvar.</div>';
}

async function carregarHistorico(){
  const r=await fetch(`${API}/admin/historico?limite=100`,{headers:hdr()});
  const hist=await r.json();
  document.getElementById('tbody-hist').innerHTML=hist.map(h=>`
    <tr>
      <td><code style="font-size:12px;color:#ccc">${h.usuario}</code></td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h.pergunta}</td>
      <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)">${h.resposta}</td>
      <td style="color:var(--muted);white-space:nowrap">${new Date(h.criado_em).toLocaleString('pt-BR')}</td>
    </tr>`).join('');
}
</script>
</body>
</html>
