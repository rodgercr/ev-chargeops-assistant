<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoodWeAI — EV ChargeOps Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:#E3000F;--red2:#ff1a26;--dark:#1a1a1a;--dark2:#252525;--dark3:#2f2f2f;--white:#fff;--muted:#888;--border:#3a3a3a}
body{font-family:'Barlow',sans-serif;background:var(--dark);color:var(--white);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* LOGIN */
#login{position:fixed;inset:0;background:var(--dark);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .3s}
.lbox{width:400px;background:var(--dark2);border:1px solid var(--dark3);border-top:3px solid var(--red);padding:2.5rem 2rem}
.brand{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700;letter-spacing:3px}
.brand span{color:var(--red)}
.lsub{font-size:11px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-top:3px;margin-bottom:2rem}
.lbox label{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;margin-top:1rem}
.lbox input{width:100%;background:var(--dark3);border:1px solid #444;color:var(--white);padding:10px 14px;font-family:'Barlow',sans-serif;font-size:15px;outline:none;transition:border-color .2s}
.lbox input:focus{border-color:var(--red)}
.lbtn{width:100%;margin-top:1.8rem;padding:13px;background:var(--red);color:var(--white);border:none;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:background .2s}
.lbtn:hover{background:var(--red2)}.lbtn:disabled{background:#555;cursor:not-allowed}
.lerr{margin-top:.8rem;font-size:13px;color:var(--red);text-align:center;min-height:18px}

/* HEADER */
#app{display:flex;flex-direction:column;height:100vh}
header{background:var(--dark2);border-bottom:1px solid var(--border);padding:0 1.5rem;height:60px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hl{display:flex;align-items:center;gap:14px}
.mark{width:36px;height:36px;background:var(--red);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px}
.htitle{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:600;letter-spacing:1px}
.htitle span{color:var(--red)}
.hsub{font-size:11px;color:var(--muted);letter-spacing:1px;margin-top:1px}
.hr{display:flex;align-items:center;gap:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 2s infinite}
.st{font-size:12px;color:var(--muted)}
.agent-badge{padding:4px 12px;font-size:11px;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--border);color:var(--muted)}
.agent-badge.sindico{border-color:#3060a0;color:#60a0e0}
.agent-badge.morador{border-color:#207040;color:#60c080}
.agent-badge.admin{border-color:#6030a0;color:#b088f0}
.hbtn{background:none;border:1px solid #444;color:var(--muted);padding:5px 12px;font-size:12px;cursor:pointer;font-family:'Barlow',sans-serif;transition:all .2s}
.hbtn:hover{border-color:var(--red);color:var(--red)}

/* MESSAGES */
#msgs{flex:1;overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:1rem;scroll-behavior:smooth}
#msgs::-webkit-scrollbar{width:4px}
#msgs::-webkit-scrollbar-thumb{background:var(--dark3);border-radius:2px}
.msg{display:flex;gap:10px;max-width:78%;animation:slideUp .25s ease}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.bot{align-self:flex-start}
.av{width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700}
.msg.bot .av{background:var(--red);color:var(--white)}
.msg.user .av{background:var(--dark3);color:var(--muted);border:1px solid #444}
.bub{padding:11px 15px;font-size:14px;line-height:1.65}
.msg.bot .bub{background:var(--dark2);border:1px solid var(--dark3);border-left:2px solid var(--red);color:#e8e8e8}
.msg.user .bub{background:var(--red);color:var(--white)}
.srcs{margin-top:7px;display:flex;flex-wrap:wrap;gap:4px}
.stag{font-size:10px;letter-spacing:1px;text-transform:uppercase;background:var(--dark3);color:var(--muted);padding:2px 8px;border:1px solid #444}
.typing{display:flex;gap:4px;align-items:center;padding:14px}
.typing span{width:6px;height:6px;background:var(--red);border-radius:50%;animation:bounce .9s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}

/* WELCOME */
.welcome{text-align:center;padding:3rem 1rem;animation:fadeIn .5s}
.wicon{width:64px;height:64px;background:var(--red);display:flex;align-items:center;justify-content:center;margin:0 auto 1.2rem;font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700}
.welcome h2{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:600;letter-spacing:1px;margin-bottom:8px}
.welcome p{font-size:14px;color:var(--muted);line-height:1.6;max-width:400px;margin:0 auto}
.sugs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:1.4rem}
.sug{background:var(--dark2);border:1px solid #444;color:#ccc;padding:8px 14px;font-size:13px;cursor:pointer;font-family:'Barlow',sans-serif;transition:all .2s}
.sug:hover{border-color:var(--red);color:var(--white)}

/* INPUT */
#inp{background:var(--dark2);border-top:1px solid var(--border);padding:1rem 1.5rem;flex-shrink:0}
.row{display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;background:var(--dark3);border:1px solid #444;color:var(--white);padding:11px 16px;font-family:'Barlow',sans-serif;font-size:14px;outline:none;resize:none;min-height:44px;max-height:120px;transition:border-color .2s;line-height:1.5}
textarea:focus{border-color:var(--red)}
textarea::placeholder{color:#555}
#sbtn{width:44px;height:44px;background:var(--red);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s}
#sbtn:hover{background:var(--red2)}
#sbtn:disabled{background:#444;cursor:not-allowed}
#sbtn svg{width:18px;height:18px;fill:white}
.hint{font-size:11px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
.hint a{color:var(--muted);text-decoration:none;font-size:11px;transition:color .2s}
.hint a:hover{color:var(--red)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="lbox">
    <div class="brand">GOODWE<span>AI</span></div>
    <div class="lsub">Assistente GoodWe AI</div>
    <label>Usuário</label>
    <input id="u" type="text" placeholder="seu usuário" autocomplete="off">
    <label>Senha</label>
    <input id="p" type="password" placeholder="••••••••">
    <button class="lbtn" id="lb" onclick="login()">Entrar</button>
    <div class="lerr" id="er"></div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <header>
    <div class="hl">
      <div class="mark">K</div>
      <div>
        <div class="htitle">GOODWE<span>AI</span></div>
        <div class="hsub" id="hsub">GoodWeAI · Assistente Virtual</div>
      </div>
    </div>
    <div class="hr">
      <div class="dot"></div>
      <span class="st">Online</span>
      <div class="agent-badge" id="abadge">—</div>
      <button class="hbtn" onclick="logout()">Sair</button>
    </div>
  </header>

  <div id="msgs"></div>

  <div id="inp">
    <div class="row">
      <textarea id="q" placeholder="Digite sua mensagem..." rows="1"
        onkeydown="tecla(event)" oninput="resize(this)"></textarea>
      <button id="sbtn" onclick="send()">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="hint">
      <span>Enter para enviar · Shift+Enter nova linha</span>
      <div style="display:flex;gap:12px">
        <a href="/sindico.html">Painel Síndico</a>
        <a href="/admin.html">Painel Admin</a>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:8000';
let token = null, perfil = null, nome = null;

const SUGESTOES = {
  sindico: ['Consumo do mês atual','Incidentes pendentes','Cargas registradas hoje','Resumo geral do condomínio'],
  admin:   ['Listar todos os usuários','Consumo do mês atual','Incidentes pendentes','Resumo geral'],
  morador: ['Prazo de entrega','Como fazer uma troca?','Formas de pagamento','Canais de suporte'],
};

const ENDPOINT = {
  sindico: '/chat/sindico',
  admin:   '/chat/sindico',
  morador: '/chat/morador',
};

// Recupera sessão do admin se vier do painel
const savedToken = sessionStorage.getItem('token');
const savedPerfil = sessionStorage.getItem('perfil');
const savedNome = sessionStorage.getItem('nome');
if (savedToken && savedPerfil) {
  token = savedToken; perfil = savedPerfil; nome = savedNome;
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('abadge').textContent = perfil;
  document.getElementById('abadge').className = 'agent-badge ' + perfil;
  document.getElementById('hsub').textContent = 'GoodWeAI · ' + perfil.charAt(0).toUpperCase() + perfil.slice(1);
  mostrarBoas();
}

document.getElementById('p').addEventListener('keydown', e => { if(e.key==='Enter') login(); });

async function login() {
  const u = document.getElementById('u').value.trim();
  const p = document.getElementById('p').value;
  const lb = document.getElementById('lb'), er = document.getElementById('er');
  if (!u || !p) { er.textContent = 'Preencha usuário e senha.'; return; }
  lb.disabled = true; lb.textContent = 'Entrando...'; er.textContent = '';
  try {
    const r = await fetch(`${API}/auth/login`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({username: u, password: p})
    });
    if (!r.ok) { er.textContent = 'Usuário ou senha incorretos.'; lb.disabled=false; lb.textContent='Entrar'; return; }
    const d = await r.json();
    token = d.access_token; perfil = d.perfil; nome = d.nome;
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('abadge').textContent = perfil;
    document.getElementById('abadge').className = `agent-badge ${perfil}`;
    document.getElementById('hsub').textContent = `GoodWeAI · ${perfil.charAt(0).toUpperCase()+perfil.slice(1)}`;
    mostrarBoas();
    document.getElementById('q').focus();
  } catch { er.textContent = 'Erro de conexão.'; lb.disabled=false; lb.textContent='Entrar'; }
}

function logout() {
  sessionStorage.removeItem('token');
  sessionStorage.removeItem('perfil');
  sessionStorage.removeItem('nome');
  token = perfil = nome = null;
  document.getElementById('login').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('p').value = '';
  document.getElementById('er').textContent = '';
  document.getElementById('lb').disabled = false;
  document.getElementById('lb').textContent = 'Entrar';
  document.getElementById('msgs').innerHTML = '';
}

function mostrarBoas() {
  const sugs = SUGESTOES[perfil] || SUGESTOES.morador;
  const saudacao = perfil === 'sindico' ? 'Olá, Síndico!' : perfil === 'admin' ? 'Olá, Admin!' : `Olá${nome ? ', '+nome.split(' ')[0] : ''}!`;
  const desc = perfil === 'sindico' ? 'Consulte dados, relatórios e incidentes do condomínio.'
             : perfil === 'admin'   ? 'Acesso completo ao sistema GoodWeAI.'
             : 'Como posso ajudar você hoje?';
  document.getElementById('msgs').innerHTML = `
    <div class="welcome" id="wlc">
      <div class="wicon">K</div>
      <h2>${saudacao}</h2>
      <p>${desc}</p>
      <div class="sugs">${sugs.map(s=>`<button class="sug" onclick="sug(this)">${s}</button>`).join('')}</div>
    </div>`;
}

function sug(el) { document.getElementById('q').value = el.textContent; send(); }
function resize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,120)+'px'; }
function tecla(e) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} }

function addMsg(txt, tipo, fontes=[]) {
  const w = document.getElementById('wlc'); if(w) w.remove();
  const m = document.getElementById('msgs'), d = document.createElement('div');
  d.className = `msg ${tipo}`;
  const av = tipo === 'bot' ? 'K' : (nome ? nome[0].toUpperCase() : 'U');
  const fs = fontes.length ? `<div class="srcs">${fontes.map(f=>`<span class="stag">${f}</span>`).join('')}</div>` : '';
  d.innerHTML = `<div class="av">${av}</div><div><div class="bub">${txt.replace(/\n/g,'<br>')}</div>${tipo==='bot'?fs:''}</div>`;
  m.appendChild(d); m.scrollTop = m.scrollHeight;
}

function showTyping() {
  const m=document.getElementById('msgs'),d=document.createElement('div');
  d.className='msg bot';d.id='typ';
  d.innerHTML=`<div class="av">K</div><div class="bub" style="padding:0"><div class="typing"><span></span><span></span><span></span></div></div>`;
  m.appendChild(d);m.scrollTop=m.scrollHeight;
}
function hideTyping(){const t=document.getElementById('typ');if(t)t.remove();}

async function send() {
  const q = document.getElementById('q'), txt = q.value.trim();
  if (!txt || !token) return;
  q.value=''; q.style.height='auto';
  document.getElementById('sbtn').disabled = true;
  addMsg(txt, 'user'); showTyping();
  const endpoint = ENDPOINT[perfil] || '/chat/morador';
  try {
    const r = await fetch(`${API}${endpoint}`, {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'Authorization':`Bearer ${token}`},
      body: JSON.stringify({pergunta: txt})
    });
    hideTyping();
    if (r.status === 401) { logout(); return; }
    const d = await r.json();
    addMsg(d.resposta, 'bot', d.fontes || []);
  } catch { hideTyping(); addMsg('Erro de conexão. Verifique se o servidor está rodando.', 'bot'); }
  document.getElementById('sbtn').disabled = false;
  document.getElementById('q').focus();
}
</script>
</body>
</html>
