<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoodWeAI — EV ChargeOps Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:#1a1a1a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.brand{font-family:'Barlow Condensed',sans-serif;font-size:48px;font-weight:700;letter-spacing:4px;margin-bottom:8px}
.brand span{color:#E3000F}
.sub{font-size:13px;color:#888;letter-spacing:4px;text-transform:uppercase;margin-bottom:3rem}
.cards{display:flex;gap:1.5rem}
.card{width:220px;background:#252525;border:1px solid #2f2f2f;padding:2.5rem 1.5rem;text-align:center;cursor:pointer;transition:all .2s;text-decoration:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:1rem}
.card:hover{border-color:#E3000F;transform:translateY(-2px)}
.icon{width:56px;height:56px;background:#E3000F;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700}
.card h3{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:600;letter-spacing:1px}
.card p{font-size:12px;color:#888;line-height:1.5}
</style>
</head>
<body>
  <div class="brand">GOODWE<span>AI</span></div>
  <div class="sub">Assistente Virtual</div>
  <div class="cards">
    <a href="/chat.html" class="card">
      <div class="icon">C</div>
      <h3>Chatbot</h3>
      <p>Converse com o assistente GoodWe AI</p>
    </a>
    <a href="/admin.html" class="card">
      <div class="icon">A</div>
      <h3>Admin</h3>
      <p>Dashboard, usuários e configurações</p>
    </a>
  </div>
</body>
</html>
